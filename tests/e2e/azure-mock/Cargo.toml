[package]
name = "azure-mock"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.22"
hickory-proto = { version = "0.26", default-features = false, features = ["std", "dnssec-ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
